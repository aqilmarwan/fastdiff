apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: quant-studio
  labels: { app: inference }
spec:
  replicas: 1
  # A cold deploy provisions a new GPU node + pulls the multi-GB image + syncs
  # ~26GB of TensorRT engine bundles from S3 (init container) + inits CUDA/TRT.
  # Measured end-to-end at ~18-20 min on a fresh g6 node, so give it 30 min of
  # headroom. Keep the CI `rollout status --timeout` (ci.yml) >= this value.
  progressDeadlineSeconds: 1800
  # Recreate, not RollingUpdate: with replicas=1 a rolling update surges a 2nd
  # pod that needs a 2nd GPU node live at the same time as the old one. g6e/g5
  # capacity in ap-southeast-5 is thin, so that surge can stall indefinitely.
  # Recreate tears the old pod down first, freeing its GPU for the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: inference }
  template:
    metadata:
      labels: { app: inference }
    spec:
      # S3 read access for the engine sync comes from this IRSA account
      # (created by eksctl; see infra/eksctl-cluster.yaml).
      serviceAccountName: inference
      # GPU scheduling is driven by the nvidia.com/gpu request + toleration
      # below, which EKS Auto Mode's Karpenter provisions natively from the
      # gpu-l40s NodePool. A custom `role: gpu` nodeSelector does NOT work here:
      # Auto Mode won't provision a new node for a custom label it doesn't
      # manage ("label role does not have known values"), so it's omitted.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Sync the prebuilt TensorRT engine bundles from S3 into the shared volume
      # before the server starts. No HF download at runtime.
      initContainers:
        - name: fetch-engines
          image: amazon/aws-cli:2.17.0
          command: ["sh", "-c", "aws s3 sync \"$STUDIO_ENGINE_S3_URI\" /engines --only-show-errors"]
          env:
            - name: STUDIO_ENGINE_S3_URI
              value: "s3://quant-studio-engine-bucket"
          volumeMounts:
            - name: engines
              mountPath: /engines
      containers:
        - name: inference
          # CI overrides this with the ECR image via `kubectl set image`
          # (see .github/workflows/ci.yml); :latest is the manual fallback.
          # NOTE: this must be a valid image ref, not a placeholder -- `kubectl
          # apply -f infra/k8s/` (no envsubst) creates a pod from it *before* the
          # set-image step runs, so a placeholder like ECR_REGISTRY/... yields a
          # stuck InvalidImageName pod that holds the GPU node.
          image: 913488665670.dkr.ecr.ap-southeast-5.amazonaws.com/quantstudio-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Only the web origin may call the API.
            - name: STUDIO_CORS_ORIGINS
              value: "https://fastdiff.vercel.app"
            - name: STUDIO_ENGINE_DIR
              value: /engines
            # Keep 1 bundle hot — safe on a 24GB card (A10G/L4). Raise to 2 on L40S.
            - name: STUDIO_MAX_RESIDENT
              value: "1"
            # Surfaced for clear errors if a bundle is missing (init container fetches).
            - name: STUDIO_ENGINE_S3_URI
              value: "s3://quant-studio-engine-bucket"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              nvidia.com/gpu: "1"   # one L40S per pod
              memory: 30Gi
          # prebuilt TensorRT engine bundles (synced from S3 by the init container)
          volumeMounts:
            - name: engines
              mountPath: /engines
          startupProbe:            # generous: TRT + CUDA init on boot
            httpGet: { path: /healthz, port: 8000 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 20
      volumes:
        - name: engines
          emptyDir:
            sizeLimit: 60Gi
