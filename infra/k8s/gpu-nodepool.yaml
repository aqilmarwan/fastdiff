# EKS Auto Mode GPU NodePool + the inference ServiceAccount.
#
# Your cluster is EKS Auto Mode, which provisions nodes from NodePools (Karpenter)
# rather than the fixed managed node group in eksctl-cluster.yaml. This NodePool is
# what lets the inference pod get a GPU node: it launches g6 (L4, 24GB) nodes
# tainted `nvidia.com/gpu`. The inference pod lands here purely via its
# `nvidia.com/gpu` resource request + matching toleration - Auto Mode provisions
# GPU nodes for that natively and ships the NVIDIA driver (no device plugin).
#
# Name is historical (there is no L40S in this region - see below); kept to avoid
# churning the live NodePool.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-l40s
spec:
  template:
    spec:
      requirements:
        # g6.2xlarge (L4) is the ONLY GPU instance type offered in ap-southeast-5.
        # g6e (L40S) and g5 (A10G) are not available in this region at all
        # (`aws ec2 describe-instance-type-offerings --region ap-southeast-5`), so
        # they must not be listed here or Karpenter finds no launchable type and
        # the pod stays Pending forever.
        #
        # No custom `role` label: EKS Auto Mode won't provision a new node for a
        # label it doesn't manage ("label role does not have known values"). The
        # nvidia.com/gpu request + taint toleration is what routes pods here.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6.2xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default          # Auto Mode's built-in NodeClass
      terminationGracePeriod: 24h0m0s
  limits:
    # The "Running On-Demand G and VT instances" quota in ap-southeast-5 is 8 vCPU
    # = exactly one g6.2xlarge. That hard cap is why the deployment uses the
    # Recreate strategy (a rolling update would need a 2nd GPU node = 16 vCPU and
    # could never surge). Request a quota increase to run >1 GPU node.
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
  namespace: quant-studio
  # S3 read for the engine sync comes from an EKS Pod Identity association (below),
  # so no IRSA annotation is needed on Auto Mode:
  #   aws eks create-pod-identity-association --cluster-name quant-studio \
  #     --namespace quant-studio --service-account inference \
  #     --role-arn arn:aws:iam::<acct>:role/ptq-gpu-inference-s3
