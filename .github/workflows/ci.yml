name: CI

# Tests only. The inference service runs on Modal serverless (deployed manually
# with `modal deploy serverless/modal_app.py`); the web app is on Vercel. Neither
# is built or deployed from CI, so there are no cloud credentials here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------- tests ----
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: inference/requirements.txt
      - name: Install dependencies
        run: pip install -r inference/requirements.txt pytest httpx   # httpx: FastAPI TestClient
      - name: Run tests (demo plane)
        run: pytest inference -q
        env:
          STUDIO_DEMO: "true"
          STUDIO_CORS_ORIGINS: "http://localhost:3000,http://localhost:3100"
          STUDIO_MAX_STEPS: "100"
          STUDIO_MAX_DIM: "1024"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
